<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Liquid Focus">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#090d16">
    
    <!-- アプリアイコン設定（同じフォルダに icon.png として保存） -->
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="manifest" href="manifest.json">

    <title>Liquid Focus - 作業時間可視化アプリ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen pb-24 select-none theme-dark">

    <div id="app" class="app-shell max-w-lg mx-auto min-h-screen shadow-2xl border-x relative flex flex-col">

        <!-- ヘッダー -->
        <header class="app-header px-5 pt-6 pb-3 flex items-center justify-between backdrop-blur-md sticky top-0 z-20 border-b">
            <div class="flex items-center gap-2.5">
                <button id="back-btn" onclick="navigateTo('home')" class="hidden p-2 -ml-2 rounded-full icon-btn transition">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                </button>
                <img id="header-app-icon" src="icon.png" alt="Liquid Focus" class="w-8 h-8 rounded-xl object-cover shadow-md border border-white/20" onerror="this.style.display='none'">
                <h1 id="header-title" class="text-xl font-bold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-blue-500 to-fuchsia-500">Liquid Focus</h1>
            </div>

            <div class="flex items-center gap-2">
                <!-- 計測中インジケーター -->
                <div id="active-timer-pill" onclick="openActiveSpace()" class="hidden cursor-pointer flex items-center gap-2 px-3 py-1.5 rounded-full timer-pill text-xs font-semibold">
                    <span class="w-2 h-2 rounded-full bg-cyan-400 animate-ping"></span>
                    <span id="pill-text">計測中 00:00</span>
                </div>

                <!-- ウィジェット手動同期ボタン -->
                <button id="sync-widget-btn" onclick="syncToShortcuts(true)" title="ウィジェットへ同期" class="p-2 rounded-full theme-btn transition active:scale-95">
                    <svg class="w-5 h-5 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                </button>

                <!-- テーマ切り替えボタン -->
                <button id="theme-toggle-btn" onclick="toggleTheme()" title="テーマ切り替え" class="p-2 rounded-full theme-btn transition active:scale-95">
                    <svg id="icon-sun" class="w-5 h-5 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                    <svg id="icon-moon" class="w-5 h-5 text-slate-700 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
                </button>
            </div>
        </header>

        <!-- ==================== ホーム画面 ==================== -->
        <main id="view-home" class="flex-1 px-4 pt-4 space-y-6">
            
            <!-- ウィジェットプレビューエリア -->
            <section class="widget-card rounded-3xl p-4 relative overflow-hidden">
                <div class="flex items-center justify-between mb-2">
                    <span class="text-[11px] font-bold uppercase tracking-wider text-muted flex items-center gap-1.5">
                        <span class="w-1.5 h-1.5 rounded-full bg-cyan-400 shadow-[0_0_8px_#00f0ff]"></span>
                        ホームウィジェット表示中
                    </span>
                    <button onclick="openWidgetModal()" class="text-xs font-semibold text-accent transition">変更</button>
                </div>
                <div id="widget-preview-content" class="flex items-center gap-4"></div>
            </section>

            <!-- 上部：棒グラフ（液体）＆折れ線グラフの複合チャート -->
            <section class="surface-card rounded-3xl p-5 shadow-lg border">
                <div class="flex flex-wrap items-center justify-between gap-2 mb-4">
                    <div>
                        <h2 class="text-sm font-bold text-primary">日ごとの頑張り推移</h2>
                        <p class="text-xs text-muted">ネオン液体の蓄積と達成ペース</p>
                    </div>
                    <select id="home-chart-filter" onchange="renderHomeChart()" class="text-xs font-semibold input-control rounded-xl px-3 py-2 border focus:ring-2 focus:ring-cyan-500 outline-none">
                        <option value="total">総合時間（全スペース）</option>
                    </select>
                </div>

                <div class="relative h-52 w-full pt-4" id="home-chart-container"></div>
            </section>

            <!-- 下部：作成した可視化スペース一覧 -->
            <section class="space-y-3">
                <div class="flex items-center justify-between px-1">
                    <h2 class="text-base font-bold text-primary">可視化スペース</h2>
                    <span id="space-count" class="text-xs text-muted font-medium">0個</span>
                </div>
                <div id="spaces-grid" class="grid grid-cols-2 gap-3.5"></div>
            </section>
        </main>

        <!-- ==================== 可視化スペース詳細画面 ==================== -->
        <main id="view-space" class="hidden flex-1 px-4 pt-4 space-y-6">
            
            <section class="surface-card rounded-3xl p-6 shadow-xl border flex flex-col items-center relative overflow-hidden">
                <div class="w-full flex justify-between items-center mb-4 z-10">
                    <span id="space-detail-badge" class="px-3.5 py-1 rounded-full text-xs font-bold text-slate-950 shadow-md">作業名</span>
                    <span id="space-detail-ratio" class="text-sm font-bold text-secondary">0.0h / 2.0h</span>
                </div>

                <!-- 大きな液体タンク -->
                <div id="main-tank-container" class="liquid-container w-44 h-52 rounded-3xl flex flex-col justify-end relative mb-6">
                    <div id="tank-nozzle" class="absolute top-0 left-1/2 -translate-x-1/2 w-5 h-2 rounded-b-full bg-slate-600/80 z-20 transition-all"></div>

                    <div class="absolute inset-0 flex flex-col items-center justify-center z-20 pointer-events-none">
                        <span id="space-tank-percent" class="text-3xl font-extrabold text-white drop-shadow-[0_2px_8px_rgba(0,0,0,0.85)]">0%</span>
                        <span id="space-timer-display" class="text-xs font-mono font-semibold text-cyan-100 mt-1.5 bg-slate-950/75 border border-white/15 px-2.5 py-0.5 rounded-full">00:00:00</span>
                    </div>

                    <div id="space-tank-liquid" class="liquid-layer w-full" style="height: 0%; background-color: #00f0ff; --neon-color: #00f0ff;">
                        <div class="liquid-wave-back" id="space-tank-wave-back"></div>
                        <div class="liquid-wave-front" id="space-tank-wave"></div>
                    </div>
                </div>

                <!-- 再生・停止ボタン -->
                <div class="flex items-center gap-4 z-10">
                    <button id="timer-toggle-btn" onclick="toggleTimer()" class="flex items-center justify-center gap-2 px-8 py-4 rounded-2xl font-bold text-slate-950 shadow-[0_0_20px_rgba(0,240,255,0.4)] transition transform active:scale-95 bg-cyan-400 hover:bg-cyan-300">
                        <svg id="icon-play" class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                        <svg id="icon-pause" class="w-6 h-6 hidden" fill="currentColor" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                        <span id="timer-btn-label">計測開始</span>
                    </button>
                    
                    <button onclick="addMockMinutes(15)" title="テスト用に+15分追加" class="p-4 rounded-2xl secondary-btn border font-bold text-xs transition active:scale-95">
                        +15m
                    </button>
                </div>
                <p class="text-[11px] text-muted mt-3 text-center">計測中はしずくが落ちてネオンの液体がたまっていきます</p>
            </section>

            <!-- 週間推移グラフ -->
            <section class="surface-card rounded-3xl p-5 shadow-lg border">
                <h3 class="text-sm font-bold text-primary mb-1">週間推移グラフ</h3>
                <p class="text-xs text-muted mb-4">日ごとの蓄積量と達成ライン</p>
                <div class="relative h-44 w-full" id="space-chart-container"></div>
            </section>

            <!-- スペース設定画面 -->
            <section class="surface-card rounded-3xl p-5 shadow-lg border space-y-4">
                <h3 class="text-sm font-bold text-primary border-b divider pb-2">スペース設定</h3>
                
                <div>
                    <label class="block text-xs font-semibold text-muted mb-1">作業名</label>
                    <input type="text" id="edit-space-name" class="w-full px-3.5 py-2.5 rounded-xl input-control border text-sm font-medium focus:outline-none focus:ring-2 focus:ring-cyan-500">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-muted mb-1">1日の理想時間（時間）</label>
                    <input type="number" step="0.5" min="0.5" max="24" id="edit-space-ideal" class="w-full px-3.5 py-2.5 rounded-xl input-control border text-sm font-medium focus:outline-none focus:ring-2 focus:ring-cyan-500">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-muted mb-1">ネオン液体の色</label>
                    <div class="flex items-center gap-3">
                        <input type="color" id="edit-space-color" class="w-12 h-10 rounded-lg cursor-pointer border-0 bg-transparent">
                        <div class="flex gap-2" id="edit-color-presets"></div>
                    </div>
                </div>

                <div class="pt-2 flex items-center justify-between gap-3">
                    <button onclick="deleteCurrentSpace()" class="px-4 py-2.5 rounded-xl text-xs font-bold text-rose-500 bg-rose-500/10 border border-rose-500/30 hover:bg-rose-500/20 transition">
                        削除する
                    </button>
                    <button onclick="saveSpaceSettings()" class="flex-1 py-2.5 rounded-xl text-xs font-bold text-slate-950 bg-cyan-400 hover:bg-cyan-300 shadow-[0_0_15px_rgba(0,240,255,0.3)] transition">
                        設定を保存
                    </button>
                </div>
            </section>
        </main>

        <!-- ==================== 固定フッターアクションバー ==================== -->
        <div id="home-bottom-bar" class="app-footer fixed bottom-0 left-0 right-0 max-w-lg mx-auto px-4 py-3 backdrop-blur-md border-t flex items-center justify-between z-30">
            <div class="flex items-center gap-2.5">
                <button onclick="openWidgetModal()" class="flex items-center gap-1.5 px-3.5 py-3 rounded-2xl secondary-btn border font-bold text-xs transition active:scale-95">
                    <svg class="w-4 h-4 text-cyan-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"></path></svg>
                    <span>ウィジェット設定</span>
                </button>

                <button onclick="openCreateModal()" class="flex items-center gap-1.5 px-4 py-3 rounded-2xl bg-cyan-400 hover:bg-cyan-300 text-slate-950 font-bold text-xs transition active:scale-95 shadow-[0_0_16px_rgba(0,240,255,0.35)]">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"></path></svg>
                    <span>新しいスペース</span>
                </button>
            </div>
        </div>

        <!-- ==================== 新規スペース作成モーダル ==================== -->
        <div id="modal-create" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-4">
            <div class="modal-card border w-full max-w-md rounded-3xl p-6 space-y-5 shadow-2xl transform transition-all">
                <div class="flex justify-between items-center">
                    <h3 class="text-lg font-bold text-primary">新しい可視化スペース</h3>
                    <button onclick="closeModal('modal-create')" class="p-1.5 rounded-full secondary-btn">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                    </button>
                </div>

                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-secondary mb-1.5">作業名（夢に向けた取り組み）</label>
                        <input type="text" id="new-space-name" placeholder="例：プログラミング学習、英語、筋トレ" class="w-full px-4 py-3 rounded-2xl input-control border text-sm focus:outline-none focus:ring-2 focus:ring-cyan-400">
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-secondary mb-1.5">1日の理想時間（時間）</label>
                        <input type="number" id="new-space-ideal" value="2.0" step="0.5" min="0.5" max="24" class="w-full px-4 py-3 rounded-2xl input-control border text-sm focus:outline-none focus:ring-2 focus:ring-cyan-400">
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-secondary mb-1.5">ネオン液体の色（自由に選択）</label>
                        <div class="flex items-center gap-3">
                            <input type="color" id="new-space-color" value="#00f0ff" class="w-12 h-11 rounded-xl cursor-pointer border-0 bg-transparent">
                            <div class="flex flex-wrap gap-2" id="new-color-presets"></div>
                        </div>
                    </div>
                </div>

                <button onclick="createSpace()" class="w-full py-3.5 rounded-2xl bg-cyan-400 hover:bg-cyan-300 text-slate-950 font-bold text-sm shadow-[0_0_20px_rgba(0,240,255,0.4)] transition active:scale-95">
                    スペースを作成する
                </button>
            </div>
        </div>

        <!-- ==================== ウィジェット設定モーダル ==================== -->
        <div id="modal-widget" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-4">
            <div class="modal-card border w-full max-w-md rounded-3xl p-6 space-y-5 shadow-2xl">
                <div class="flex justify-between items-center">
                    <div>
                        <h3 class="text-lg font-bold text-primary">ウィジェット表示設定</h3>
                        <p class="text-xs text-muted">ホーム画面でパッと目につく表示を選択</p>
                    </div>
                    <button onclick="closeModal('modal-widget')" class="p-1.5 rounded-full secondary-btn">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                    </button>
                </div>

                <div class="space-y-2.5 max-h-72 overflow-y-auto pr-1" id="widget-options-list"></div>

                <div class="info-box border p-3 rounded-2xl text-[11px] text-secondary leading-relaxed">
                    💡 <strong class="text-accent">総合時間</strong>を選ぶと、全スペースの理想時間を合計した枠の中に、ネオン色の液体が<strong class="text-accent">混ざらずに発光する層</strong>として積み上がります。
                </div>
            </div>
        </div>

        <!-- カスタム通知トースト -->
        <div id="toast" class="fixed top-20 left-1/2 transform -translate-x-1/2 toast-box border text-xs font-bold px-4 py-2.5 rounded-full opacity-0 pointer-events-none transition-opacity duration-300 z-50">
            メッセージ
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
